<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Obniz SDK Example</title>
  </head>
  <body>
    <h1>Obniz SDK Browser Example</h1>

    <button id="btn">Load machines</button>

    <pre id="output"></pre>

    <script type="module">
      // Import from the built SDK
      const { ObnizNow } = await import('../dist/index.mjs');

      const button = document.getElementById("btn");
      const output = document.getElementById("output");

      // In production, use: https://cdn.jsdelivr.net/npm/@obniz/obniz-now-sdk@0.1.11/dist/index.mjs
      const client = new ObnizNow({
        baseUrl: window.location.origin,
        cookies: {
          // Browser requests use the existing same-origin session cookies.
          token: "",
          accountId: "",
        },
      });

      button.addEventListener("click", async () => {
        output.textContent = "Loading...";

        try {
          const response = await client.machines.listMachines({
            limit: 10,
            offset: 0,
          });

          if (!response.items?.length) {
            output.textContent = "No machines found";
            return;
          }

          const lines = response.items.map(
            (item) => `${item.machine.name || "Unnamed"} (${item.machine.id})`,
          );

          output.textContent =
            `Found ${response.count} machines\n\n` + lines.join("\n");
        } catch (err) {
          output.textContent = "Error: " + err.message;
        }
      });
    </script>
  </body>
</html>
